<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>S001 审看 · GPT 知识宇宙图鉴</title>
  <link rel="stylesheet" href="/node_modules/@fontsource-variable/noto-sans-sc/index.css">
  <link rel="stylesheet" href="/node_modules/@fontsource/space-grotesk/400.css">
  <link rel="stylesheet" href="/node_modules/@fontsource/cormorant-garamond/400.css">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <main>
    <header><a class="wordmark" href="/">ATLAS<span>OF KNOWLEDGE</span></a><div class="review-status"><i></i>S001 · 待你审看</div></header>
    <section class="intro"><div><p class="eyebrow">01 / BOOT — 唤醒</p><h1>每一次探索，始于一个问题。</h1></div><p class="version">分镜 001 / v002<br>00:00 — 00:08 · 无配乐预览</p></section>
    <section class="viewer" aria-label="分镜动态预览"><canvas id="view" width="1920" height="1080" aria-label="光标与提问动画"></canvas></section>
    <section class="transport" aria-label="播放控制"><button id="play">播放</button><button id="restart" class="secondary">重播</button><output id="clock">00:00.00 / 00:08.00</output><label class="timeline"><span class="sr-only">镜头时间</span><input id="seek" type="range" min="0" max="8" step="0.01" value="0"></label><button id="fullscreen" class="secondary">全屏画面</button></section>
    <section class="notes"><div><p class="eyebrow">这一镜，看什么</p><p>光标的呼吸、双语文字出现的速度，以及问题出现后的停留是否合适。</p></div><div><p class="eyebrow">审看节奏</p><p>0–1.4s 光标 · 1.4–3.1s 标题 · 3.0–6.2s 双语输入 · 6.2–8s 停留</p></div></section>
    <footer><span>按空格播放 / 暂停 · ← → 移动 0.25 秒</span><span>本镜确认后，再制作下一镜。</span></footer>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
